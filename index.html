<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pastel Music</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(-45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb, #e0c3fc, #8ec5fc);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #334155;
      overflow-y: auto;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* MÀN HÌNH CHÀO MỪNG */
    .welcome-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      z-index: 100;
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      text-align: center;
      padding: 20px;
    }

    .welcome-screen.hidden {
      opacity: 0;
      visibility: hidden;
      transform: scale(1.05);
      pointer-events: none;
    }

    .welcome-title {
      font-size: 2.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, #f43f5e, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }

    .welcome-sub {
      font-size: 1.1rem;
      color: #64748b;
      font-weight: 500;
      margin-bottom: 36px;
    }

    .start-btn {
      padding: 16px 40px;
      font-size: 1.1rem;
      font-weight: 700;
      color: white;
      background: linear-gradient(135deg, #f43f5e, #8b5cf6);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(236, 72, 153, 0.4);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .start-btn:hover {
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 15px 35px rgba(139, 92, 246, 0.5);
    }

    /* TRÌNH PHÁT NHẠC CHIA ĐÔI */
    .player {
      width: 100%;
      max-width: 820px;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border-radius: 36px;
      padding: 32px;
      box-shadow: 0 20px 50px rgba(168, 85, 247, 0.15),
                  0 10px 20px rgba(0, 0, 0, 0.05),
                  inset 0 0 0 1.5px rgba(255, 255, 255, 0.9);
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      gap: 32px;
      align-items: center;
    }

    .player.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* NỬA TRÁI: ẢNH VÀ TÊN BÀI HÁT */
    .player-left {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-right: 1px solid rgba(203, 213, 225, 0.4);
      padding-right: 24px;
    }

    .cover-wrapper { 
      width: 210px; 
      height: 210px; 
      margin-bottom: 20px; 
    }

    .cover {
      width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
      box-shadow: 0 12px 35px rgba(139, 92, 246, 0.25);
      transition: all 0.5s ease;
      border: 6px solid #ffffff;
    }

    .cover.playing { 
      animation: spin 20s linear infinite; 
      box-shadow: 0 0 30px rgba(236, 72, 153, 0.4), 0 0 50px rgba(139, 92, 246, 0.3);
    }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .song-info-left { text-align: center; }
    .song-title { font-size: 1.25rem; font-weight: 700; color: #1e293b; margin-bottom: 4px; }
    .song-artist { font-size: 0.9rem; color: #64748b; font-weight: 500; }

    /* NỬA PHẢI: ĐIỀU KHIỂN & DANH SÁCH PHÁT */
    .player-right {
      flex: 1.2;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .header { text-align: left; margin-bottom: 16px; }
    .header h1 { 
      font-size: 1.5rem; 
      font-weight: 800; 
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header p { font-size: 0.8rem; color: #64748b; margin-top: 2px; font-weight: 500; }

    .progress-container { margin-bottom: 16px; user-select: none; }
    .progress-bar {
      width: 100%; height: 8px; background: rgba(203, 213, 225, 0.5); border-radius: 20px;
      cursor: pointer; position: relative; overflow: hidden; touch-action: none;
    }
    .progress {
      height: 100%; width: 0%; 
      background: linear-gradient(90deg, #f43f5e, #ec4899, #8b5cf6, #06b6d4);
      background-size: 200% 200%;
      animation: gradientBG 5s ease infinite;
      border-radius: 20px;
    }
    .time {
      display: flex; justify-content: space-between; font-size: 0.75rem;
      color: #64748b; margin-top: 6px; font-weight: 600;
    }

    .controls {
      display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 16px;
    }
    .ctrl-btn {
      background: none; border: none; cursor: pointer; color: #64748b;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: flex; align-items: center; justify-content: center; padding: 6px;
    }
    .ctrl-btn:hover { color: #8b5cf6; transform: scale(1.15); }
    .play-btn {
      width: 50px; height: 50px; 
      background: linear-gradient(135deg, #f43f5e, #8b5cf6);
      border-radius: 50%; color: white; 
      box-shadow: 0 10px 25px rgba(236, 72, 153, 0.4);
    }
    .play-btn:hover { transform: scale(1.1); box-shadow: 0 12px 30px rgba(139, 92, 246, 0.5); }
    .play-btn svg { width: 24px; height: 24px; }

    .playlist { max-height: 150px; overflow-y: auto; padding-right: 4px; margin-bottom: 12px; }
    .playlist::-webkit-scrollbar { width: 5px; }
    .playlist::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    
    .song-item {
      display: flex; align-items: center; gap: 10px; padding: 8px 10px;
      border-radius: 14px; cursor: pointer; transition: all 0.25s ease; margin-bottom: 6px;
      background: rgba(255, 255, 255, 0.4);
    }
    .song-item:hover { 
      background: rgba(255, 255, 255, 0.85); 
      transform: translateX(4px);
    }
    .song-item.active { 
      background: linear-gradient(90deg, rgba(244, 63, 94, 0.15), rgba(139, 92, 246, 0.15));
      border: 1px solid rgba(139, 92, 246, 0.3);
    }
    .song-item img { width: 36px; height: 36px; border-radius: 10px; object-fit: cover; }
    .song-item .info { flex: 1; min-width: 0; }
    .song-item .name { font-size: 0.82rem; font-weight: 600; color: #1e293b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .song-item .artist { font-size: 0.72rem; color: #64748b; margin-top: 2px; }

    .volume-box {
      display: flex; align-items: center; gap: 10px;
      padding-top: 10px; border-top: 1px solid rgba(203, 213, 225, 0.4);
    }
    .volume-box svg { color: #8b5cf6; }
    .volume-slider {
      flex: 1; -webkit-appearance: none; height: 6px; background: rgba(203, 213, 225, 0.5);
      border-radius: 10px; outline: none; cursor: pointer;
    }
    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none; width: 14px; height: 14px; 
      background: linear-gradient(135deg, #f43f5e, #8b5cf6);
      border-radius: 50%; cursor: pointer;
    }

    @media (max-width: 768px) {
      .player {
        flex-direction: column;
        padding: 24px;
        gap: 20px;
      }
      .player-left {
        border-right: none;
        border-bottom: 1px solid rgba(203, 213, 225, 0.4);
        padding-right: 0;
        padding-bottom: 20px;
        width: 100%;
      }
      .player-right { width: 100%; }
      .header { text-align: center; }
      .cover-wrapper { width: 160px; height: 160px; }
    }
  </style>
</head>
<body>

  <!-- MÀN HÌNH CHÀO MỪNG -->
  <div class="welcome-screen" id="welcome-screen">
    <h1 class="welcome-title">Are you ready?</h1>
    <p class="welcome-sub">Let's relax with good music</p>
    <button class="start-btn" id="start-btn">
      <span>Bắt đầu ngay</span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    </button>
  </div>

  <!-- KHUNG TRÌNH PHÁT NHẠC CHIA ĐÔI -->
  <div class="player" id="player">
    <!-- NỬA TRÁI: ẢNH VÀ THÔNG TIN -->
    <div class="player-left">
      <div class="cover-wrapper">
        <img id="cover" class="cover" src="" alt="Cover">
      </div>
      <div class="song-info-left">
        <div class="song-title" id="title">—</div>
        <div class="song-artist" id="artist">—</div>
      </div>
    </div>

    <!-- NỬA PHẢI: ĐIỀU KHIỂN & DANH SÁCH -->
    <div class="player-right">
      <div class="header">
        <h1>Pastel Music</h1>
        <p>Giai điệu thư giãn đa sắc</p>
      </div>

      <div class="progress-container">
        <div class="progress-bar" id="progress-bar">
          <div class="progress" id="progress"></div>
        </div>
        <div class="time">
          <span id="current-time">0:00</span>
          <span id="duration">0:00</span>
        </div>
      </div>

      <div class="controls">
        <button class="ctrl-btn" id="prev">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="ctrl-btn play-btn" id="play">
          <svg id="play-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="ctrl-btn" id="next">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>

      <div class="playlist" id="playlist"></div>

      <div class="volume-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
        </svg>
        <input type="range" class="volume-slider" id="volume" min="0" max="1" step="0.01" value="0.85">
      </div>
    </div>
  </div>

  <audio id="audio" preload="auto"></audio>

  <script>
    const songs = [
      {
        title: "toidaidot",
        artist: "GREY D",
        src: "toidaidot.mp3",
        cover: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTUINIMIrHSXfbVKkN4H-WGQ-DtJX2tV8rzGOGJypy6LXZDbDp5xeo9r5h5&s=10"
      },
      {
        title: "Anh đã quen với cô đơn",
        artist: "Soobin Hoàng Sơn",
        src: "Anhdaquenvoicodon.mp3",
        cover: "https://photo-resize-zmp3.zadn.vn/w600_r1x1_jpeg/covers/a/b/ab44498b5b432879428719390baf1180_1490064587.jpg"
      },
      {
        title: "Cơn mưa cuối",
        artist: "JustaTee x Binz",
        src: "Conmuacuoi.mp3",
        cover: "https://photo-resize-zmp3.zadn.vn/w600_r1x1_jpeg/covers/a/f/af1166b25cf77fb307716eda9cc172d1_1477998573.jpg"
      },
      {
        title: "Nợ em cả bầu trời",
        artist: "Thỏ (Da LAB), Hoàng Tôn, OSAD, Hồ Đông Quan, Hà An Huy",
        src: "Noemcabautroi.mp3",
        cover: "https://i.ytimg.com/vi/tyM46ksZTI4/maxresdefault.jpg"
      },
      {
        title: "để dành cho em",
        artist: "Dangrangto",
        src: "dedanhchoem.mp3",
        cover: "https://i.ytimg.com/vi/zkXuRWHvz18/maxresdefault.jpg"
      }
    ];

    const DISCORD_WEBHOOK = "https://discord.com/api/webhooks/1549940139508105226/_jk37hER3sF2OAP5K1xlyNRVGGGy2jPecxhxgqvA9d__LSlim_-p6wVYMvvxaI5gsOUs";

    const welcomeScreen = document.getElementById('welcome-screen');
    const startBtn = document.getElementById('start-btn');
    const player = document.getElementById('player');

    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('play');
    const playIcon = document.getElementById('play-icon');
    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');
    const progress = document.getElementById('progress');
    const progressBar = document.getElementById('progress-bar');
    const currentTimeEl = document.getElementById('current-time');
    const durationEl = document.getElementById('duration');
    const titleEl = document.getElementById('title');
    const artistEl = document.getElementById('artist');
    const coverEl = document.getElementById('cover');
    const playlistEl = document.getElementById('playlist');
    const volumeSlider = document.getElementById('volume');

    let currentIndex = 0;
    let isPlaying = false;
    let isDragging = false;
    let animationId = null;

    startBtn.addEventListener('click', () => {
      welcomeScreen.classList.add('hidden');
      player.classList.add('show');
      playSong();
    });

    async function logVisitor() {
  try {
    // Dùng ipwho.is để lấy cả IP, Quốc gia và Thành phố
    const res = await fetch('https://ipwho.is/');
    const data = await res.json();
    
    const ipAddress = data.ip || 'Không rõ';
    const country = data.country || 'Không rõ';
    const city = data.city || 'Không rõ';

    const ua = navigator.userAgent;
    
    let browserName = "Khác";
    if (/chrome|crios|crmo/i.test(ua)) browserName = "Chrome";
    else if (/firefox|fxios/i.test(ua)) browserName = "Firefox";
    else if (/safari/i.test(ua) && !/chrome|crios|crmo/i.test(ua)) browserName = "Safari";
    else if (/edg/i.test(ua)) browserName = "Edge";
    else if (/zalo/i.test(ua)) browserName = "Zalo In-App Browser";

    let osName = "Khác (PC/Laptop)";
    if (/android/i.test(ua)) osName = "Android";
    else if (/iphone|ipad|ipod/i.test(ua)) osName = "iOS";
    else if (/win/i.test(ua)) osName = "Windows";
    else if (/mac/i.test(ua)) osName = "MacOS";
    else if (/linux/i.test(ua)) osName = "Linux";

    const logData = {
      embeds: [{
        color: 0x8b5cf6,
        fields: [
          { name: "IP", value: `\`${ipAddress}\``, inline: true },
          { name: "Quốc gia", value: `**${country}**`, inline: true },
          { name: "Thành phố", value: `**${city}**`, inline: true },
          { name: "Hệ điều hành", value: `**${osName}**`, inline: true },
          { name: "Trình duyệt", value: `**${browserName}**`, inline: true },
          { name: "Thời gian", value: new Date().toLocaleString('vi-VN'), inline: false },
          { name: "Trang web sử dụng", value: window.location.href, inline: false },
          { name: "User-Agent", value: `\`\`\`${ua}\`\`\`` }
        ],
        timestamp: new Date().toISOString()
      }]
    };

    if (DISCORD_WEBHOOK) {
      await fetch(DISCORD_WEBHOOK, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(logData)
      });
    }
  } catch (err) { console.error("Lỗi gửi log:", err); }
}
logVisitor();

    function renderPlaylist() {
      playlistEl.innerHTML = songs.map((song, index) => `
        <div class="song-item ${index === currentIndex ? 'active' : ''}" data-index="${index}">
          <img src="${song.cover}" alt="${song.title}">
          <div class="info">
            <div class="name">${song.title}</div>
            <div class="artist">${song.artist}</div>
          </div>
        </div>
      `).join('');

      document.querySelectorAll('.song-item').forEach(item => {
        item.addEventListener('click', () => {
          const index = parseInt(item.dataset.index);
          if (index !== currentIndex) {
            currentIndex = index;
            loadSong(currentIndex);
            playSong();
          } else {
            isPlaying ? pauseSong() : playSong();
          }
        });
      });
    }

    function loadSong(index) {
      const song = songs[index];
      titleEl.textContent = song.title;
      artistEl.textContent = song.artist;
      coverEl.src = song.cover;
      audio.src = song.src;
      renderPlaylist();
    }

    function playSong() {
      isPlaying = true;
      audio.play().catch(() => {});
      playIcon.innerHTML = `<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>`;
      coverEl.classList.add('playing');
      startProgressLoop();
    }

    function pauseSong() {
      isPlaying = false;
      audio.pause();
      playIcon.innerHTML = `<path d="M8 5v14l11-7z"/>`;
      coverEl.classList.remove('playing');
      cancelAnimationFrame(animationId);
    }

    function startProgressLoop() {
      cancelAnimationFrame(animationId);
      function update() {
        if (!isDragging && audio.duration) {
          progress.style.width = (audio.currentTime / audio.duration * 100) + '%';
          currentTimeEl.textContent = formatTime(audio.currentTime);
        }
        animationId = requestAnimationFrame(update);
      }
      update();
    }

    function seek(e) {
      const rect = progressBar.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      let percent = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
      progress.style.width = (percent * 100) + '%';
      if (audio.duration) {
        audio.currentTime = percent * audio.duration;
        currentTimeEl.textContent = formatTime(audio.currentTime);
      }
    }

    progressBar.addEventListener('mousedown', e => { isDragging = true; seek(e); });
    window.addEventListener('mousemove', e => { if (isDragging) seek(e); });
    window.addEventListener('mouseup', () => { isDragging = false; });
    progressBar.addEventListener('click', seek);

    playBtn.addEventListener('click', () => isPlaying ? pauseSong() : playSong());
    prevBtn.addEventListener('click', () => {
      currentIndex = (currentIndex - 1 + songs.length) % songs.length;
      loadSong(currentIndex); playSong();
    });
    nextBtn.addEventListener('click', () => {
      currentIndex = (currentIndex + 1) % songs.length;
      loadSong(currentIndex); playSong();
    });

    audio.addEventListener('loadedmetadata', () => { durationEl.textContent = formatTime(audio.duration); });
    audio.addEventListener('ended', () => { currentIndex = (currentIndex + 1) % songs.length; loadSong(currentIndex); playSong(); });
    volumeSlider.addEventListener('input', e => audio.volume = e.target.value);

    function formatTime(sec) {
      if (isNaN(sec)) return '0:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' + s : s}`;
    }

    loadSong(0);
    audio.volume = 0.85;
  </script>
</body>
</html>
